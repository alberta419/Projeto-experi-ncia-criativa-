<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - PetZen</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <header class="main-header">
        <nav>
            <h1 class="logo">PETZEN - ADMIN</h1>
        </nav>
    </header>

    <main class="page-container">
        <div class="content-box" style="max-width: 400px; margin: 80px auto;">
            <form action="/login-admin" method="POST">
                <h1 class="section-title">Login Administrativo</h1>

                {% if msg_login %}
                <small class="field-error" style="text-align:center; display:block; margin-bottom:10px;">
                    {{ msg_login }}
                </small>
                {% endif %}

                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" name="email" placeholder="admin@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="password-container">
                        <input type="password" name="senha" placeholder="Senha" required>
                        <span class="toggle-password" data-target="senha">👁️</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-block btn-rounded">Entrar</button>
            </form>
        </div>
    </main>

    <script src="/assets/script.js"></script>
</body>
</html>
